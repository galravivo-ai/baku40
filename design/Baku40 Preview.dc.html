<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Assistant:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,200..400,0,-25&display=block" rel="stylesheet">
<style>
  html { background:#F6F7F9 !important; }
  html, body { margin:0; height:100%; background:#F6F7F9; font-family:'Assistant',system-ui,sans-serif; }
  a { color:#1A63B8; }
  * { box-sizing:border-box; }
</style>
</helmet>

<div dir="rtl" style="height:100vh; display:grid; grid-template-columns:minmax(180px,278px) minmax(0,1fr); background:#FFFFFF; overflow:hidden">
  <div style="background:#1A1D42; display:flex; flex-direction:column; min-height:0">
    <div style="padding:20px 20px 16px; border-bottom:1px solid #2C3160">
      <img src="assets/baku40-logo.png" alt="Baku40" style="height:26px; width:auto; align-self:flex-start; filter:brightness(0) invert(1)">
      <div style="font:400 13px 'Assistant',sans-serif; color:#8D92B8; margin-top:8px">מצב צפייה · {{ total }} מסכים</div>
    </div>
    <div style="flex:1; min-height:0; overflow:auto; padding:8px 0 20px">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="6">
        <div style="padding:14px 20px 4px">
          <div style="font:700 12px 'Heebo',sans-serif; letter-spacing:.12em; color:#8FBEF2">{{ g.title }}</div>
        </div>
        <sc-for list="{{ g.items }}" as="i" hint-placeholder-count="4">
          <div onClick="{{ i.onClick }}" style="display:flex; align-items:center; gap:10px; padding:11px 20px; cursor:pointer; background:{{ i.bg }}; border-inline-end:3px solid {{ i.line }}">
            <span style="font-family:'Material Symbols Rounded'; font-variation-settings:'wght' 200; font-size:20px; color:{{ i.fg }}; opacity:.9">{{ i.icon }}</span>
            <div style="flex:1; min-width:0">
              <div style="font:600 15px 'Assistant',sans-serif; color:{{ i.fg }}">{{ i.name }}</div>
              <div style="font:400 11px ui-monospace,monospace; color:#8D92B8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">{{ i.url }}</div>
            </div>
          </div>
        </sc-for>
      </sc-for>
    </div>
  </div>

  <div style="display:flex; flex-direction:column; min-height:0">
    <div style="background:#FFFFFF; border-bottom:1px solid #D9E3F0; padding:12px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap">
      <div style="min-width:0">
        <div style="font:800 22px 'Heebo',sans-serif; color:#262A5B; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">{{ curName }}</div>
        <div style="font:400 12px ui-monospace,monospace; color:#8C8577">{{ curUrl }}</div>
      </div>
      <div style="flex:1; min-width:12px"></div>
      <div onClick="{{ toggleOutline }}" style="display:flex; align-items:center; gap:8px; border:1px solid {{ outlineBorder }}; background:{{ outlineBg }}; color:{{ outlineFg }}; border-radius:9px; padding:10px 14px; font:600 15px 'Assistant',sans-serif; cursor:pointer">
        <span style="font-family:'Material Symbols Rounded'; font-variation-settings:'wght' 200; font-size:19px">ads_click</span>
        <span>הדגשת קישורים</span>
      </div>
      <div style="display:flex; border:1px solid #D9E3F0; border-radius:9px; overflow:hidden">
        <sc-for list="{{ zooms }}" as="z" hint-placeholder-count="3">
          <div onClick="{{ z.onClick }}" style="cursor:pointer; padding:10px 14px; background:{{ z.bg }}; color:{{ z.fg }}; font:600 15px 'Assistant',sans-serif; border-inline-start:1px solid #D9E3F0">{{ z.label }}</div>
        </sc-for>
      </div>
      <div style="display:flex; gap:8px">
        <div onClick="{{ prev }}" style="width:42px; height:42px; border:1px solid #D9E3F0; border-radius:9px; display:flex; align-items:center; justify-content:center; cursor:pointer"><span style="font-family:'Material Symbols Rounded'; font-variation-settings:'wght' 200; font-size:20px; color:#262A5B">chevron_right</span></div>
        <div onClick="{{ next }}" style="width:42px; height:42px; border:1px solid #D9E3F0; border-radius:9px; display:flex; align-items:center; justify-content:center; cursor:pointer"><span style="font-family:'Material Symbols Rounded'; font-variation-settings:'wght' 200; font-size:20px; color:#262A5B">chevron_left</span></div>
      </div>
      <a href="{{ curFile }}" target="_blank" style="display:flex; align-items:center; gap:8px; background:#1665C1; color:#FFFFFF; border-radius:9px; padding:11px 16px; font:700 15px 'Assistant',sans-serif; text-decoration:none">
        <span style="font-family:'Material Symbols Rounded'; font-variation-settings:'wght' 300; font-size:19px">open_in_new</span>
        <span>קובץ העיצוב</span>
      </a>
    </div>

    <div ref="{{ stageRef }}" style="flex:1; min-height:0; overflow:auto; background:#FFFFFF; padding:18px">
      <div style="width:{{ stageW }}px; height:{{ stageH }}px; margin:0 auto; position:relative">
        <iframe src="{{ curSrc }}" title="{{ curName }}" onLoad="{{ onFrame }}" scrolling="no" style="position:absolute; top:0; right:0; width:{{ frameW }}px; height:{{ frameH }}px; border:1px solid #D9E3F0; border-radius:12px; background:#FFFFFF; transform:scale({{ scale }}); transform-origin:top right"></iframe>
      </div>
    </div>
  </div>
</div>
</x-dc>

  all() { return this.D.groups.reduce((a, g) => a.concat(g.items), []); }

  current() {
    const items = this.all();
    return items.find(i => i.id === this.state.cur) || items[0];
  }

  applyOutline() {
    try {
      const doc = this.frame && this.frame.contentDocument;
      if (!doc) return;
      let el = doc.getElementById('__om_outline');
      if (this.state.outline) {
        if (!el) {
          el = doc.createElement('style');
          el.id = '__om_outline';
          doc.head.appendChild(el);
        }
        el.textContent = 'a, [onclick] { outline:2px solid rgba(22,101,193,.85) !important; outline-offset:2px; border-radius:6px; }';
      } else if (el) {
        el.textContent = '';
      }
    } catch (e) { /* cross-origin */ }
  }

  measure(tries) {
    const f = this.frame;
    if (!f) return;
    let doc;
    try { doc = f.contentDocument; } catch (e) { return; }
    const h = doc && doc.body ? Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight) : 0;
    if (h > 400) {
      if (Math.abs(h - this.state.frameH) > 8) {
        this.setState({ frameH: h }, () => window.requestAnimationFrame(() => this.scrollToAnchor()));
      } else {
        this.scrollToAnchor();
      }
    }
    if (tries > 0) {
      window.clearTimeout(this._m);
      this._m = window.setTimeout(() => this.measure(tries - 1), 160);
    }
  }

  scrollToAnchor() {
    const f = this.frame;
    if (!f || !this.stage.current) return;
    let doc, hash = '', loadedFile = '';
    try {
      doc = f.contentDocument;
      hash = (f.contentWindow.location.hash || '').replace('#', '');
      loadedFile = decodeURIComponent((f.contentWindow.location.pathname || '').split('/').pop() || '');
    } catch (e) { return; }
    if (!doc) return;

    const cur = this.current();
    const hashChanged = hash && hash !== this._hash;
    let anchor = cur.anchor;

    if (hashChanged && doc.getElementById(hash)) {
      // genuine in-frame navigation: the frame wins, sidebar follows it
      this._hash = hash;
      anchor = hash;
      const match = this.all().find(i => i.anchor === hash && i.file === loadedFile)
        || this.all().find(i => i.file === loadedFile);
      if (match && match.id !== this.state.cur) {
        this._file = loadedFile;
        this._key = match.id + '|' + this.state.zoom + '|' + this.state.frameH;
        this.setState({ cur: match.id });
      }
    } else {
      // sidebar / arrow driven: the selection wins, keep the frame hash in sync
      this._hash = anchor;
      if (hash !== anchor && loadedFile === cur.file) {
        try { f.contentWindow.location.replace('#' + anchor); } catch (e) { /* noop */ }
      }
    }

    const el = doc.getElementById(anchor);
    if (!el) return;
    this.stage.current.scrollTop = Math.max(0, Math.round(el.offsetTop * this.state.zoom - 12));
    this.applyOutline();
  }

  watchFrame() {
    const f = this.frame;
    if (!f) return;
    try {
      const w = f.contentWindow;
      if (!w || w.__omWatched) return;
      w.__omWatched = true;
      w.addEventListener('hashchange', () => this.queueSync(40));
      w.document.addEventListener('click', () => this.queueSync(90), true);
    } catch (e) { /* noop */ }
  }

  queueSync(delay) {
    window.clearTimeout(this._t);
    this._t = window.setTimeout(() => this.measure(5), delay || 30);
  }

  componentDidUpdate() {
    try {
      const cur = this.current();
      if (this._file !== cur.file) {
        this._file = cur.file;
        this._key = null;
        if (this.state.frameH !== 800) { this.setState({ frameH: 800 }); return; }
      }
      const key = cur.id + '|' + this.state.zoom + '|' + this.state.frameH;
      if (key !== this._key) {
        this._key = key;
        this.queueSync(30);
      }
      this.applyOutline();
    } catch (e) { /* noop */ }
  }

  renderVals() {
    const s = this.state;
    const items = this.all();
    const cur = items.find(i => i.id === s.cur) || items[0];
    const idx = items.indexOf(cur);
    const frameW = cur.w;
    const frameH = s.frameH;
    const enc = (f) => encodeURI(f);
    return {
      total: items.length,
      groups: this.D.groups.map(g => ({
        title: g.title,
        items: g.items.map(i => ({
          name: i.name, url: i.url, icon: i.icon,
          onClick: () => this.setState({ cur: i.id }),
          bg: s.cur === i.id ? 'rgba(22,101,193,.16)' : 'transparent',
          line: s.cur === i.id ? '#1665C1' : 'transparent',
          fg: s.cur === i.id ? '#FFFFFF' : '#D8DCF0'
        }))
      })),
      curName: cur.name, curUrl: cur.url,
      curFile: enc(cur.file), curSrc: enc(cur.file),
      frameW: frameW, frameH: frameH,
      scale: s.zoom, stageW: Math.round(frameW * s.zoom), stageH: Math.round(frameH * s.zoom),
      zooms: [{ label: '50%', v: 0.5 }, { label: '62%', v: 0.62 }, { label: '80%', v: 0.8 }, { label: '100%', v: 1 }].map(z => ({
        label: z.label, onClick: () => this.setState({ zoom: z.v }),
        bg: Math.abs(s.zoom - z.v) < 0.01 ? '#262A5B' : '#FFFFFF',
        fg: Math.abs(s.zoom - z.v) < 0.01 ? '#FFFFFF' : '#262A5B'
      })),
      prev: () => this.setState({ cur: items[(idx - 1 + items.length) % items.length].id }),
      next: () => this.setState({ cur: items[(idx + 1) % items.length].id }),
      stageRef: this.stage,
      onFrame: (e) => { this.frame = e.target; this._file = this.current().file; this._hash = null; this._key = null; this.watchFrame(); this.queueSync(60); },
      toggleOutline: () => this.setState({ outline: !s.outline }),
      outlineBg: s.outline ? '#262A5B' : '#FFFFFF',
      outlineFg: s.outline ? '#FFFFFF' : '#262A5B',
      outlineBorder: s.outline ? '#262A5B' : '#D9E3F0'
    };
  }
}
</script>
</body>
</html>
