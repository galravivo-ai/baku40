<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Assistant:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,200..400,0,-25&display=block" rel="stylesheet">
<style>
  html { background:#F6F7F9 !important; }
  body { margin:0; background:#F6F7F9; font-family:'Assistant',system-ui,sans-serif; }
  a { color:#1A63B8; text-decoration:none; }
  a:hover { color:#1665C1; }
  * { box-sizing:border-box; }
</style>
</helmet>

<div dir="rtl" style="min-height:100vh; background:#FFFFFF">
  <div style="position:relative; overflow:hidden; background:#262A5B">
    <div style="position:absolute; inset:0; opacity:.42; background-image:url('assets/photos/bay-night.png'); background-size:cover; background-position:50% 55%"></div>
    <div style="position:relative; max-width:1180px; margin:0 auto; padding:44px 32px 52px">
      <div style="display:flex; align-items:center; gap:20px; margin-bottom:38px">
        <img src="assets/baku40-logo.png" alt="Baku40" style="height:34px; width:auto; align-self:center; filter:brightness(0) invert(1)">
        <div style="font:600 15px 'Assistant',sans-serif; color:#BFC2D8">מפת המסכים · גרסת עיצוב</div>
      </div>
      <h1 style="font:900 clamp(40px,6vw,68px)/1.06 'Heebo',sans-serif; color:#FFFFFF; margin:0 0 16px; max-width:760px">כל המסכים של Baku40 במקום אחד</h1>
      <p style="font:400 19px/1.7 'Assistant',sans-serif; color:#E4E6F1; margin:0; max-width:680px">לחצו על כל מסך כדי לפתוח אותו. המסכים אינטראקטיביים — פילטרים, חיפוש, שמירת מקומות ומפה עובדים.</p>
      <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:28px">
        <sc-for list="{{ stats }}" as="s" hint-placeholder-count="4">
          <div style="background:rgba(247,243,236,.1); border:1px solid rgba(247,243,236,.28); border-radius:10px; padding:14px 18px">
            <div style="font:800 24px 'Heebo',sans-serif; color:#FFFFFF">{{ s.n }}</div>
            <div style="font:400 14px 'Assistant',sans-serif; color:#BFC2D8">{{ s.label }}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="max-width:1180px; margin:0 auto; padding:48px 32px 88px; display:flex; flex-direction:column; gap:44px">
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
      <div>
        <div style="display:flex; align-items:baseline; gap:14px; margin-bottom:6px">
          <h2 style="font:800 30px 'Heebo',sans-serif; color:#262A5B; margin:0">{{ g.title }}</h2>
          <a href="{{ g.href }}" style="font:600 15px 'Assistant',sans-serif; color:#1A63B8; text-decoration:underline; text-underline-offset:3px">פתחו את הקובץ</a>
        </div>
        <div style="font:400 16px/1.6 'Assistant',sans-serif; color:#5C5A66; margin-bottom:18px">{{ g.note }}</div>
        <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px">
          <sc-for list="{{ g.items }}" as="i" hint-placeholder-count="4">
            <a href="{{ i.href }}" style="display:block; background:#FFFFFF; border:1px solid #E3EBF5; border-radius:14px; overflow:hidden; color:inherit" style-hover="border-color:#1665C1">
              <div style="height:132px; background-color:#EFF4FA; background-image:var(--p); --p:{{ i.bg }}; background-size:cover; background-position:center"></div>
              <div style="padding:18px">
                <div style="display:flex; align-items:center; gap:9px; margin-bottom:6px">
                  <span style="font-family:'Material Symbols Rounded'; font-variation-settings:'wght' 200; font-size:20px; color:#262A5B; opacity:.55">{{ i.icon }}</span>
                  <div style="font:700 20px/1.25 'Heebo',sans-serif; color:#262A5B">{{ i.name }}</div>
                </div>
                <div style="font:400 15px/1.6 'Assistant',sans-serif; color:#2A2A30; margin-bottom:10px">{{ i.desc }}</div>
                <div style="font:400 12px ui-monospace,monospace; color:#8C8577">{{ i.url }}</div>
              </div>
            </a>
          </sc-for>
        </div>
      </div>
    </sc-for>

  </div>
</div>
</x-dc>
