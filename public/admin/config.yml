# Admin (Decap CMS) — generated; every form edits the files in content/.
backend:
  name: github
  repo: galravivo-ai/baku40
  branch: main
  auth_endpoint: api/decap/auth
  commit_messages:
    update: 'עדכון תוכן: {{collection}} / {{slug}}'
    create: 'תוכן חדש: {{collection}} / {{slug}}'
    delete: 'מחיקה: {{collection}} / {{slug}}'
    uploadMedia: העלאת תמונה {{path}}
    deleteMedia: מחיקת תמונה {{path}}
locale: he
site_url: https://baku40.vercel.app
media_folder: design/assets/photos/uploads
public_folder: assets/photos/uploads
collections:
- name: settings
  label: הגדרות
  files:
  - name: site
    label: הגדרות אתר
    file: content/site.json
    fields:
    - name: name
      label: שם האתר
      widget: string
      required: true
    - name: baseUrl
      label: כתובת האתר
      widget: string
      required: true
      hint: https://baku40.co.il
    - name: titleTemplate
      label: תבנית כותרת
      widget: string
      required: true
      hint: '%s מוחלף בשם העמוד'
    - name: defaultTitle
      label: כותרת ברירת מחדל
      widget: string
      required: true
    - name: defaultDescription
      label: תיאור ברירת מחדל
      widget: text
      required: true
    - name: defaultOgImage
      label: תמונת שיתוף ברירת מחדל
      widget: image
      required: false
      choose_url: true
    - name: locale
      label: locale
      widget: hidden
      required: false
    - name: lang
      label: lang
      widget: hidden
      required: false
    - name: dir
      label: dir
      widget: hidden
      required: false
    - name: twitterCard
      label: twitterCard
      widget: hidden
      required: false
    - name: organization
      label: organization
      widget: hidden
      required: false
    - name: showBookingPhotos
      label: להציג תמונות Booking (ללא רישיון)
      widget: boolean
      required: false
      default: false
    - name: showUndocumentedPhotos
      label: להציג תמונות עיר בלי מקור מתועד
      widget: boolean
      required: false
      default: false
    - name: affiliateDisclosure
      label: גילוי נאות (מלא)
      widget: text
      required: true
    - name: affiliateDisclosureShort
      label: גילוי נאות (קצר, ליד כל כפתור)
      widget: string
      required: true
    - name: nav
      label: תפריט ראשי
      widget: list
      required: false
      summary: '{{fields.label}}'
      fields:
      - name: label
        label: תווית
        widget: string
        required: false
      - name: href
        label: קישור
        widget: string
        required: false
      - name: links
        label: מגה־תפריט
        widget: list
        required: false
        fields:
        - name: label
          label: תווית
          widget: string
          required: false
        - name: sub
          label: תת־כותרת
          widget: string
          required: false
        - name: href
          label: קישור
          widget: string
          required: false
      - name: feature
        label: פריט מומלץ במגה־תפריט
        widget: object
        required: false
        fields:
        - name: title
          label: כותרת
          widget: string
          required: false
        - name: text
          label: טקסט
          widget: text
          required: false
        - name: photo
          label: תמונה
          widget: image
          required: false
          choose_url: true
        - name: href
          label: קישור
          widget: string
          required: false
        collapsed: true
    - name: footerTagline
      label: משפט בפוטר
      widget: text
      required: false
    - name: footerColumns
      label: עמודות פוטר
      widget: list
      required: false
      summary: '{{fields.head}}'
      fields:
      - name: head
        label: כותרת
        widget: string
        required: false
      - name: items
        label: קישורים
        widget: list
        required: false
        fields:
        - name: label
          label: תווית
          widget: string
          required: false
        - name: href
          label: קישור
          widget: string
          required: false
    - name: footer
      label: קישורי שורה תחתונה
      widget: list
      required: false
      fields:
      - name: label
        label: תווית
        widget: string
        required: false
      - name: href
        label: קישור
        widget: string
        required: false
    - name: copyright
      label: זכויות יוצרים
      widget: string
      required: false
    - name: staticPages
      label: SEO לעמודים קבועים
      widget: list
      required: false
      summary: '{{fields.url}}'
      fields:
      - name: url
        label: כתובת
        widget: string
        required: false
      - name: metaTitle
        label: כותרת לגוגל
        widget: string
        required: false
        pattern:
        - ^.{0,65}$
        - עד 65 תווים (כותרת בגוגל)
      - name: metaDescription
        label: תיאור
        widget: text
        required: false
        pattern:
        - ^.{0,155}$
        - עד 155 תווים (תיאור בגוגל)
      - name: schema
        label: schema
        widget: hidden
        required: false
      - name: robots
        label: robots
        widget: select
        required: false
        options:
        - index,follow
        - noindex,follow
  - name: redirects
    label: הפניות (301)
    file: content/redirects.json
    fields:
    - name: items
      label: הפניות
      widget: list
      required: false
      summary: '{{fields.from}} → {{fields.to}}'
      fields:
      - name: from
        label: מ־
        widget: string
        required: true
        hint: /hotels/old-slug/
      - name: to
        label: אל
        widget: string
        required: true
